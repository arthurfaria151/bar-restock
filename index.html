<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Restock" />
  <meta name="theme-color" content="#121218" />
  <meta name="description" content="Bar restock list — tap products, set quantities, copy your list." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <title>Bar Restock</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <form id="loginForm" class="login-card" autocomplete="off">
      <h2>Sign in</h2>
      <p class="login-sub">Choose your role and enter the PIN.</p>
      <div class="role-list" role="radiogroup" aria-label="Role">
        <label class="role-option">
          <input type="radio" name="role" value="manager" required />
          <span>Venue manager</span>
        </label>
        <label class="role-option">
          <input type="radio" name="role" value="assistant" />
          <span>Venue assistant manager</span>
        </label>
        <label class="role-option">
          <input type="radio" name="role" value="supervisor" />
          <span>Shift supervisor</span>
        </label>
        <label class="role-option">
          <input type="radio" name="role" value="bartender" />
          <span>Bartenders</span>
        </label>
      </div>
      <label class="pin-label" for="loginPin">PIN</label>
      <input id="loginPin" class="login-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="••••" autocomplete="off" enterkeyhint="go" required />
      <p id="loginError" class="login-error" hidden></p>
      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
  </div>

  <header class="app-header">
    <h1>Bar Restock</h1>
    <div class="header-right">
      <span id="roleLabel" class="role-label" hidden></span>
      <button type="button" class="btn btn-ghost btn-sm" id="btnLogout" hidden>Log out</button>
      <span id="headerBadge" class="badge empty">0</span>
    </div>
  </header>

  <div id="lowBanner" class="low-banner" hidden>
    <div class="low-banner-text">
      <strong id="lowBannerTitle">Low stock</strong>
      <span id="lowBannerDetail"></span>
    </div>
    <button type="button" class="btn btn-primary btn-sm" id="btnSendReminder">Send reminder</button>
    <button type="button" class="btn btn-ghost btn-sm" id="btnDismissBanner" aria-label="Dismiss">✕</button>
  </div>

  <main>
    <section id="panel-products" class="panel active" aria-label="Products">
      <div id="productsRoot"></div>
    </section>

    <section id="panel-stock" class="panel" aria-label="Stock">
      <form id="addProductForm" class="add-product">
        <input id="newProductName" type="text" placeholder="New product name" maxlength="80" required autocomplete="off" enterkeyhint="done" />
        <select id="newProductCategory" aria-label="Category">
          <option value="Fridge">Fridge</option>
          <option value="Bar Shelves">Bar Shelves</option>
          <option value="Other">Other</option>
        </select>
        <button type="submit" class="btn btn-primary">Add product</button>
      </form>
      <div id="stockSummary" class="stock-summary"></div>
      <div id="stockRoot"></div>
    </section>

    <section id="panel-par" class="panel" aria-label="Par levels">
      <p class="par-help">Set the minimum on-hand quantity for each product. When stock hits this level, you’ll get an email reminder.</p>
      <div id="parSummary" class="stock-summary"></div>
      <div id="parRoot"></div>
    </section>

    <section id="panel-restock" class="panel" aria-label="Restock list">
      <div class="restock-actions">
        <button type="button" class="btn btn-primary" id="btnCopy">Copy list</button>
        <button type="button" class="btn btn-secondary" id="btnShare" hidden>Share</button>
        <button type="button" class="btn btn-ghost" id="btnClear">Clear</button>
      </div>
      <div id="restockRoot"></div>
    </section>
  </main>

  <nav class="tab-bar" role="tablist">
    <button type="button" class="tab-btn active" data-tab="products" role="tab" aria-selected="true">
      <span class="icon">📦</span>
      Products
    </button>
    <button type="button" class="tab-btn" data-tab="stock" role="tab" aria-selected="false">
      <span class="icon">📋</span>
      Stock
    </button>
    <button type="button" class="tab-btn" data-tab="par" role="tab" aria-selected="false">
      <span class="icon">🎯</span>
      Par
      <span class="tab-badge" id="parBadge">0</span>
    </button>
    <button type="button" class="tab-btn" data-tab="restock" role="tab" aria-selected="false">
      <span class="icon">🛒</span>
      Restock
      <span class="tab-badge" id="tabBadge">0</span>
    </button>
  </nav>

  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
